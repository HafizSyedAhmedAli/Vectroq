<!DOCTYPE html>
<html>

<head>
    <title>Embed test</title>
</head>

<body style="font-family: sans-serif; max-width: 900px; margin: 40px auto;">
    <h1>My builder's website</h1>
    <p>The quote form below is loaded from Vectroq.</p>

    <iframe id="vectroq-form" src="http://localhost:3000/embed/test-go" title="Request a quote" loading="lazy"
        style="width:100%;border:0;min-height:700px"></iframe>
    <script>
        window.addEventListener("message", function (e) {
            if (e.origin !== "http://localhost:3000" || !e.data || e.data.type !== "vectroq:height") return;
            document.getElementById("vectroq-form").style.height = e.data.height + "px";
        });
    </script>

    <p>Footer of the customer's site.</p>
</body>

</html>
